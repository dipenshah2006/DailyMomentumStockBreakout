          python send_report_email.py

      - name: Send USA / NYSE Screener email
        if: needs.usa-report.result == 'success'
        env:
          GMAIL_USERNAME:     dipenshah2006@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ github.event.inputs.email_list }}
          EMAIL_SEND_MODE:    ${{ github.event.inputs.send_mode || 'bcc' }}
