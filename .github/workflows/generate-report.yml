name: Generate NSE Reports

on:
  schedule:
    - cron: '30 15 * * *'       # 9:00 PM IST every day = 3:30 PM UTC
  workflow_dispatch:
    inputs:
      email_list:
        description: 'Override recipients — comma-separated (replaces email_recipients.txt for this run)'
        required: false
        default: ''
      send_mode:
        description: 'Email send mode'
        required: false
        default: 'bcc'
        type: choice
        options:
          - bcc
          - individual
      dry_run:
        description: 'Dry run — print recipients, do NOT send'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # A stale long-running scan must not block a corrected manual run.
  cancel-in-progress: true

# ── Each report runs in its own parallel job — a failure or timeout
# ── in one does NOT affect the others. The deploy job always runs
# ── at the end to publish whatever succeeded.

jobs:

  # ════════════════════════════════════════════════════════════════
  #  1. RSI Multi-Timeframe Report
  # ════════════════════════════════════════════════════════════════
  rsi-report:
    name: RSI MTF Report
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy matplotlib requests openpyxl

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: stock_data_cache.pkl
          key: stock-cache-rsi-${{ runner.os }}-${{ hashFiles('rsi_mtf_report_nse.py') }}
          restore-keys: stock-cache-rsi-${{ runner.os }}-

      - name: Create directories
        run: mkdir -p india/NSE/NSECash india/NSE/NSESME charts

      - name: Download NSE equity list
        run: |
          curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -H "Referer: https://www.nseindia.com/" \
            --retry 3 --retry-delay 5 --max-time 30 \
            "https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv" \
            -o india/NSE/NSECash/EQUITY_L.csv \
          && echo "✅ EQUITY_L.csv: $(wc -l < india/NSE/NSECash/EQUITY_L.csv) lines" \
          || echo "⚠️  NSE CSV blocked — using built-in ticker list"

      - name: Run RSI MTF Report
        id: run
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: python rsi_mtf_report_nse.py

      - name: Upload RSI HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-html
          path: rsi_mtf_report_NSE.html
          retention-days: 3
          if-no-files-found: warn

      - name: Upload RSI Charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-charts
          path: charts/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-error-${{ github.run_number }}
          path: error_log_*.txt
          retention-days: 7
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  #  2. ATH Breakout Report
  # ═══════════════════════════════════════════════════════════════
  ath-report:
    name: ATH Breakout Report
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy

      # Restore RSI cache (if available) so ath_report.py can reuse cached DataFrames.
      # If the cache is absent, ath_report.py falls back to yfinance automatically.
      - name: Restore RSI data cache
        uses: actions/cache@v4
        with:
          path: stock_data_cache.pkl
          key: stock-cache-rsi-${{ runner.os }}-${{ hashFiles('rsi_mtf_report_nse.py') }}
          restore-keys: stock-cache-rsi-${{ runner.os }}-
        continue-on-error: true

      - name: Run ATH Breakout Report
        id: run
        env:
          PYTHONUNBUFFERED: '1'
        run: python ath_report.py

      - name: Upload ATH HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ath-html
          path: ath_report_NSE.html
          retention-days: 3
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  #  3. Rocket Scanner
  # ═══════════════════════════════════════════════════════════════
  rocket-report:
    name: Rocket Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy matplotlib requests

      # Restore RSI cache and seed rocket_cache.pkl from it.
      # If the RSI cache is absent, seed_shared_cache.py exits cleanly and
      # rocket_scanner.py falls back to its own cache / fresh yfinance downloads.
      - name: Restore RSI data cache
        uses: actions/cache@v4
        with:
          path: stock_data_cache.pkl
          key: stock-cache-rsi-${{ runner.os }}-${{ hashFiles('rsi_mtf_report_nse.py') }}
          restore-keys: stock-cache-rsi-${{ runner.os }}-
        continue-on-error: true

      - name: Seed Rocket cache from RSI cache
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python seed_shared_cache.py \
            && echo "✅ Rocket cache seeded" \
            || echo "⚠️  Seed failed — Rocket Scanner will download fresh data"

      - name: Run Rocket Scanner
        id: run
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: python rocket_scanner.py

      - name: Upload Rocket HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-html
          path: rocket_scan_latest.html
          retention-days: 3
          if-no-files-found: warn

      # Commit rocket_scan_latest.html back to repo so it survives between
      # runs and is always available in the checkout during Pages deploy.
      - name: Commit rocket_scan_latest.html to repo
        if: steps.run.outcome == 'success'
        run: |
          git config user.name  "NSE Bot"
          git config user.email "bot@noreply"
          git pull --rebase --autostash origin main
          git add rocket_scan_latest.html
          git diff --cached --quiet \
            && echo "No changes in rocket_scan_latest.html — skipping commit" \
            || (git commit -m "chore: update rocket_scan_latest.html [skip ci]" && git push)

  # ═══════════════════════════════════════════════════════════════
  #  4. F&O Multi-Indicator Scanner
  # ═══════════════════════════════════════════════════════════════
  fo-report:
    name: F&O Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy matplotlib requests openpyxl

      # F&O Scanner natively reads stock_data_cache.pkl (same v2 format as RSI MTF).
      # Restoring it here means F&O skips downloading tickers already cached by RSI.
      # If the cache is absent, fo_scanner_report.py downloads fresh data on its own.
      - name: Restore RSI data cache
        uses: actions/cache@v4
        with:
          path: stock_data_cache.pkl
          key: stock-cache-rsi-${{ runner.os }}-${{ hashFiles('rsi_mtf_report_nse.py') }}
          restore-keys: stock-cache-rsi-${{ runner.os }}-
        continue-on-error: true

      - name: Run F&O Scanner
        id: run
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: python fo_scanner_report.py

      - name: Upload F&O HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fo-html
          path: fo_report.html
          retention-days: 3
          if-no-files-found: warn

      - name: Upload F&O Charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fo-charts
          path: charts/fo/
          retention-days: 3
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  #  5. NSE Index Dashboard (Plotly — indices only, fast)
  # ═══════════════════════════════════════════════════════════════
  index-dashboard:
    name: NSE Index Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy plotly requests openpyxl kaleido

      - name: Create directories
        run: mkdir -p india/NSE/NSECash india/NSE/NseIndice india/NSE/cache IndexDashBoard/cache charts/index

      - name: Download NSE equity list
        run: |
          curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -H "Referer: https://www.nseindia.com/" \
            --retry 3 --retry-delay 5 --max-time 30 \
            "https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv" \
            -o india/NSE/NSECash/EQUITY_L.csv \
          && echo "✅ EQUITY_L.csv: $(wc -l < india/NSE/NSECash/EQUITY_L.csv) lines" \
          || echo "⚠️  NSE CSV blocked — using built-in ticker list"

      # Restore RSI cache and seed per-ticker files for the Index Dashboard.
      # If the RSI cache is absent, seed_shared_cache.py exits cleanly and
      # realtime_analysis4.py falls back to fresh yfinance downloads.
      - name: Restore RSI data cache
        uses: actions/cache@v4
        with:
          path: stock_data_cache.pkl
          key: stock-cache-rsi-${{ runner.os }}-${{ hashFiles('rsi_mtf_report_nse.py') }}
          restore-keys: stock-cache-rsi-${{ runner.os }}-
        continue-on-error: true

      - name: Seed index cache from RSI cache
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python seed_shared_cache.py \
            && echo "✅ Cache seed done" \
            || echo "⚠️  Cache seed failed — dashboard will download fresh data"

      - name: Run Index Dashboard
        id: run
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: python IndexDashBoard/realtime_analysis4.py index_dashboard_config.json

      - name: Upload Index Dashboard HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-dashboard-html
          path: |
            index_analysis.html
            charts/index/
          retention-days: 3
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  #  6. ASX Screener
  #     Scans ASX stocks; can take several hours.
  # ═══════════════════════════════════════════════════════════════
  asx-report:
    name: ASX Screener
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy matplotlib requests openpyxl

      - name: Create directories
        run: mkdir -p ASX/charts/asx

      # Keep the ASX cache between runs. Without this, every run downloads the
      # whole universe from Yahoo again and is much more likely to be rate limited.
      - name: Restore ASX data cache
        uses: actions/cache@v4
        with:
          path: asx_stock_cache.pkl
          key: asx-stock-cache-${{ runner.os }}-${{ hashFiles('ASX/NSEScreener71.py', 'ASX/nyse-listed.csv') }}
          restore-keys: |
            asx-stock-cache-${{ runner.os }}-

      - name: Run ASX Screener
        id: run
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: python ASX/NSEScreener71.py

      # Never publish a green-but-empty report when Yahoo has rate-limited the job.
      - name: Validate ASX report contains data
        id: validate
        if: steps.run.outcome == 'success'
        run: |
          test -s asx_report_NSE.html
          if ! grep -Eq 'Showing <b id="rc">[1-9][0-9]*</b> of' asx_report_NSE.html; then
            echo "❌ ASX report contains zero analysed stocks; refusing to publish it"
            exit 1
          fi
          echo "✅ ASX report contains analysed stock data"

      - name: Upload ASX HTML
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: asx-html
          path: asx_report_NSE.html
          retention-days: 3
          if-no-files-found: error

      - name: Upload ASX error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asx-error-${{ github.run_number }}
          path: error_log_*.txt
          retention-days: 7
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  #  7. USA / NYSE Screener
  #     Scans NYSE stocks; can take several hours.
  # ═══════════════════════════════════════════════════════════════
  usa-report:
    name: USA / NYSE Screener
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy matplotlib requests openpyxl

      - name: Create directories
        run: mkdir -p USAs/charts

      - name: Run USA / NYSE Screener
        id: run
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: python USAs/NSEScreener7.py

      - name: Upload USA HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usa-html
          path: USAs/rsi_mtf_report_NYSE.html
          retention-days: 3
          if-no-files-found: warn

      - name: Upload USA Charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usa-charts
          path: USAs/charts/
          retention-days: 3
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  #  8. Monthly MACD + CCI Breakout Screener
  #     Runs independently so a failure in another scanner does not
  #     prevent the monthly report from being generated.
  # ═══════════════════════════════════════════════════════════════
  monthlytrend-report:
    name: MonthlyTrend Screener
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MonthlyTrend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "yfinance>=0.2.54" "pandas>=2.0.0" "numpy>=1.24.0" \
            "scipy>=1.10.0" "pyarrow>=12.0.0"

      - name: Restore MonthlyTrend data cache
        uses: actions/cache@v4
        with:
          path: MonthlyTrend/cache_parquet
          key: monthlytrend-cache-${{ runner.os }}-${{ hashFiles('MonthlyTrend/*.py', 'MonthlyTrend/EQUITY_L.csv') }}
          restore-keys: |
            monthlytrend-cache-${{ runner.os }}-

      - name: Run MonthlyTrend Screener
        id: run
        env:
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set +e
          status=1
          for attempt in 1 2 3; do
            echo "▶ MonthlyTrend attempt ${attempt}/3"
            python MonthlyTrend/monthly_macd_cci_breakout_screener.py \
              --universe MonthlyTrend/EQUITY_L.csv \
              --workers 8 \
              2>&1 | tee "MonthlyTrend/monthlytrend-attempt-${attempt}.log"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "⚠️ MonthlyTrend failed (exit ${status}); retrying in 30 seconds..."
              sleep 30
            fi
          done
          exit "$status"

      - name: Validate MonthlyTrend report
        id: validate
        if: steps.run.outcome == 'success'
        shell: bash
        run: |
          test -s MonthlyTrend/monthly_breakout_report.html
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("MonthlyTrend/monthly_breakout_report.html").read_text(encoding="utf-8")
          match = re.search(r'<div class="sc"><div class="v">(\d+)</div><div class="l">Total</div>', html)
          if not match:
              raise SystemExit("MonthlyTrend report has no Total counter")
          total = int(match.group(1))
          if total == 0:
              raise SystemExit("MonthlyTrend report contains zero usable stocks")
          print(f"✅ MonthlyTrend report contains {total} usable stocks")
          PY

      - name: Upload MonthlyTrend report and charts
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: monthlytrend-report
          path: |
            MonthlyTrend/monthly_breakout_report.html
            MonthlyTrend/monthly_charts/
          retention-days: 3
          if-no-files-found: error

      - name: Upload MonthlyTrend run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthlytrend-logs-${{ github.run_number }}
          path: MonthlyTrend/monthlytrend-attempt-*.log
          retention-days: 7
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  #  9. Deploy & Send Emails
  #     Runs after ALL 8 report jobs — whether they pass or fail.
  #     Publishes whatever HTML was generated to GitHub Pages,
  #     then sends the appropriate emails.
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy & Email
    needs: [rsi-report, ath-report, rocket-report, fo-report, index-dashboard, asx-report, usa-report, monthlytrend-report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy matplotlib requests openpyxl

      # Download each report's HTML (continue-on-error so a missing
      # artifact from a failed job does not abort the deploy step)
      - name: Download RSI HTML
        uses: actions/download-artifact@v4
        with:
          name: rsi-html
          path: .
        continue-on-error: true

      - name: Clear previous chart staging
        run: |
          # Never fall back to committed/old PNGs when assembling Pages.
          # Each report publishes content-hashed chart filenames.
          rm -rf charts
          mkdir -p charts

      - name: Download RSI Charts
        uses: actions/download-artifact@v4
        with:
          name: rsi-charts
          path: charts
        continue-on-error: true

      - name: Download ATH HTML
        uses: actions/download-artifact@v4
        with:
          name: ath-html
          path: .
        continue-on-error: true

      - name: Download Rocket HTML
        uses: actions/download-artifact@v4
        with:
          name: rocket-html
          path: .
        continue-on-error: true

      - name: Download F&O HTML
        uses: actions/download-artifact@v4
        with:
          name: fo-html
          path: .
        continue-on-error: true

      - name: Download F&O Charts
        uses: actions/download-artifact@v4
        with:
          name: fo-charts
          path: charts/fo
        continue-on-error: true

      - name: Download Index Dashboard HTML
        uses: actions/download-artifact@v4
        with:
          name: index-dashboard-html
          path: .
        continue-on-error: true

      - name: Download ASX HTML
        uses: actions/download-artifact@v4
        with:
          name: asx-html
          path: .
        continue-on-error: true

      - name: Download USA HTML
        uses: actions/download-artifact@v4
        with:
          name: usa-html
          path: USAs
        continue-on-error: true

      - name: Download USA Charts
        uses: actions/download-artifact@v4
        with:
          name: usa-charts
          path: charts
        continue-on-error: true

      - name: Download MonthlyTrend report and charts
        uses: actions/download-artifact@v4
        with:
          name: monthlytrend-report
          path: MonthlyTrend
        continue-on-error: true

      - name: Prepare GitHub Pages output
        run: |
          mkdir -p _site

          # RSI = main page
          if [ -f "rsi_mtf_report_NSE.html" ]; then
            cp rsi_mtf_report_NSE.html _site/index.html
            echo "✅ RSI report → index.html"
          else
            latest=$(ls -t rsi_mtf_report_*.html 2>/dev/null | head -1)
            if [ -n "$latest" ]; then
              cp "$latest" _site/index.html
              echo "✅ Latest RSI: $latest"
            else
              echo "<html><body style='font-family:sans-serif;padding:40px'><h2>⏳ Report not yet generated</h2></body></html>" > _site/index.html
              echo "⚠️  No RSI report found — placeholder written"
            fi
          fi

          [ -f "ath_report_NSE.html"    ] && cp ath_report_NSE.html    _site/ath.html            && echo "✅ ATH"             || echo "⚠️  ATH not found"
          [ -f "rocket_scan_latest.html" ] && cp rocket_scan_latest.html _site/rocket.html         && echo "✅ Rocket"          || echo "⚠️  Rocket not found"
          [ -f "fo_report.html"         ] && cp fo_report.html          _site/fo.html             && echo "✅ F&O"             || echo "⚠️  F&O not found"
          [ -f "index_analysis.html"    ] && cp index_analysis.html     _site/index-dashboard.html && echo "✅ Index Dashboard" || echo "⚠️  Index Dashboard not found"
          [ -f "asx_report_NSE.html"    ] && cp asx_report_NSE.html     _site/asx.html            && echo "✅ ASX"             || echo "⚠️  ASX not found"
          [ -f "USAs/rsi_mtf_report_NYSE.html" ] && cp USAs/rsi_mtf_report_NYSE.html _site/usa.html && echo "✅ USA/NYSE"      || echo "⚠️  USA/NYSE not found"
          [ -f "MonthlyTrend/monthly_breakout_report.html" ] && cp MonthlyTrend/monthly_breakout_report.html _site/monthlytrend.html && echo "✅ MonthlyTrend" || echo "⚠️  MonthlyTrend not found"
          if [ -d "MonthlyTrend/monthly_charts" ]; then
            mkdir -p _site/monthly_charts
            cp -r MonthlyTrend/monthly_charts/. _site/monthly_charts/
            echo "✅ MonthlyTrend charts → _site/monthly_charts/"
          fi

          # Multibagger HTML is committed to the repo by multibagger-report.yml
          [ -f "multibagger_report.html" ] && cp multibagger_report.html _site/multibagger.html    && echo "✅ Multibagger (from repo)" || echo "⚠️  Multibagger not in repo yet"

          # Charts — copy from repo checkout (committed PNGs) merged with
          # any fresh PNGs downloaded from the rsi-charts artifact above.
          if [ -d "charts" ]; then
            cp -r charts _site/charts
            echo "✅ Charts → _site/charts/ ($(ls charts/*.png 2>/dev/null | wc -l) PNGs)"
          else
            echo "⚠️  No charts/ folder found"
          fi

          ls -lh _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Refresh NIFTY Indices Master
        if: needs.rsi-report.result == 'success'
        run: |
          python refresh_nifty_master.py \
            && echo "✅ NIFTY master refreshed" \
            || echo "⚠️  NIFTY master refresh failed — sector data may be stale"

      - name: Generate email summary
        if: needs.rsi-report.result == 'success'
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python generate_summary.py

      - name: Set email subject
        if: needs.rsi-report.result == 'success'
        id: email_meta
        run: |
          if [ -f email_subject.txt ]; then
            echo "subject=$(cat email_subject.txt)" >> $GITHUB_OUTPUT
          else
            echo "subject=📈 NSE Breakout Report — Run #${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      # ── Emails ──────────────────────────────────────────────────

      - name: Send RSI daily summary email
        if: needs.rsi-report.result == 'success'
        env:
          GMAIL_USERNAME:     dipenshah2006@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ github.event.inputs.email_list }}
          EMAIL_SEND_MODE:    ${{ github.event.inputs.send_mode || 'bcc' }}
          EMAIL_DRY_RUN:      ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          EMAIL_BCC_BATCH:    '100'
        run: python send_report_email.py

      - name: Send Rocket Scanner email
        if: needs.rocket-report.result == 'success'
        env:
          GMAIL_USERNAME:     dipenshah2006@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ github.event.inputs.email_list }}
          EMAIL_SEND_MODE:    ${{ github.event.inputs.send_mode || 'bcc' }}
          EMAIL_DRY_RUN:      ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          EMAIL_BCC_BATCH:    '100'
          EMAIL_BODY_FILE:    rocket_scan_latest.html
          EMAIL_SUBJECT_FILE: rocket_subject.txt
        run: |
          if [ ! -f rocket_scan_latest.html ]; then
            echo "⚠️  rocket_scan_latest.html not found — skipping"
            exit 0
          fi
          DATE=$(date +'%d %b %Y')
          echo "🚀 NSE Rocket Scanner — Breakout Candidates ${DATE}" > rocket_subject.txt
          python send_report_email.py

      - name: Send ATH Breakout email
        if: needs.ath-report.result == 'success'
        env:
