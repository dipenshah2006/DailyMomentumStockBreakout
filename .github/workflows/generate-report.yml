          echo "📊 NSE Index Dashboard — ${DATE}" > index_dashboard_subject.txt
          python send_report_email.py

      - name: Send ASX Screener email
        if: needs.asx-report.result == 'success'
        env:
          GMAIL_USERNAME:     dipenshah2006@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ github.event.inputs.email_list }}
          EMAIL_SEND_MODE:    ${{ github.event.inputs.send_mode || 'bcc' }}
          EMAIL_DRY_RUN:      ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          EMAIL_BCC_BATCH:    '100'
